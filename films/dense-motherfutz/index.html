<script>
'use strict';
// Engine/craft snapshot generated by tools/new-riso.mjs. Edit this HTML for this work.
// Donors: prints/workings (baked print), studies/index (live tone/motion), tools/lib/visual-kit.
// Re-run the generator only to create a NEW file. This source owns all subsequent art edits.
// Format: 9:16 (1080 × 1920) by default, ?aspect=1:1 for the square cut. Layout is in logical
// px, W wide and H tall. Probe renders: ?res=540 draws natively 540 px wide (K = res/1080); only
// pixel work (screens, scratch plates, vhs) runs at OUTW × OUTH. Never resample a full frame down
// instead: the halftone moirés. The screen pitch shrinks with K but keeps a floor, so dots stay
// dots; tones at low res are close to, not identical with, the full-size print.
const QS = new URLSearchParams(location.search);
const RES = clamp0(Number(QS.get('res')) || 1080);
function clamp0(r) { return Math.max(180, Math.min(1080, Math.round(r))); }
const W = 1080, H = QS.get('aspect') === '1:1' ? 1080 : 1920;
const OUTW = RES, OUTH = Math.round(RES * H / W), K = OUTW / W, PITCH = Math.max(4, 4.6 * K), DUR = 192;
const PAPER = '#F2EDE3';
const INK = {
  blue:   '#0078BF',
  pink:   '#FF48B0',
  yellow: '#FFE800',
  green:  '#00A95C',
  orange: '#FF6C2F',
  violet: '#765BA7',
  indigo: '#2E3192',
};

/* Screen angles as rational tangents (b/a). A rotated dot grid only repeats
   seamlessly on a rational tangent, so these are the real angles rather than
   the nominal 15/45/75 — any other value leaves a visible seam where the
   pattern tile wraps. */
const SCREEN = {
  blue:   { a: 4, b: 1 },   // 14.0°
  pink:   { a: 1, b: 4 },   // 76.0°
  yellow: { a: 1, b: 0 },   //  0.0°
  green:  { a: 1, b: 1 },   // 45.0°
  orange: { a: 2, b: 1 },   // 26.6°
  violet: { a: 1, b: 2 },   // 63.4°
  indigo: { a: 1, b: 1 },   // 45.0°
};

/* Registration: each plate misses by a fixed amount, in device px. */
const REG = {
  blue:   [ 1.5, -1.0], pink:   [-2.5,  2.0], yellow: [ 2.0,  1.5],
  green:  [-1.5, -1.5], orange: [ 1.0,  2.0], violet: [-2.0, -1.0],
  indigo: [ 0.0,  0.0],
};
const regOf = name => [REG[name][0] * K, REG[name][1] * K];   // registration miss in device px
// Camera for the fly-in (screen = o + (p - f)·z); identity otherwise. Screens stay pinned to the canvas.
let CAM = { z: 1, fx: 0, fy: 0, ox: 0, oy: 0 };
const camSet = g => g.setTransform(K * CAM.z, 0, 0, K * CAM.z, K * (CAM.ox - CAM.fx * CAM.z), K * (CAM.oy - CAM.fy * CAM.z));

const CX = W / 2, CY = H / 2;

/* ── deterministic randomness ─────────────────────────────────────────────── */

function mulberry32(a) {
  return function () {
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hash(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
const rngFor = (key) => mulberry32(hash(key));

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, u) => a + (b - a) * u;

function cv(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}

/* ── halftone screens ─────────────────────────────────────────────────────────
   For screen angle tanθ = b/a the dot lattice is generated by the orthogonal
   vectors P/√(a²+b²)·(a,b) and P/√(a²+b²)·(−b,a). That lattice contains
   (P√(a²+b²), 0), so a square tile of side S = P√(a²+b²) repeats seamlessly and
   holds exactly a²+b² dots.

   Screens are anchored to canvas space, never to the object being drawn. A
   screen that rides along with its subject makes the texture crawl, which is
   the single most recognisable way this look goes wrong.                     */

const screens = {};

function buildScreen(name) {
  const { a, b } = SCREEN[name];
  const n = a * a + b * b;
  const S = Math.max(2, Math.round(PITCH * Math.sqrt(n)));
  const P = S / Math.sqrt(n);              // effective pitch after rounding
  const u = P / Math.sqrt(n);
  const v1 = [u * a, u * b], v2 = [-u * b, u * a];

  // Lattice points reduced into the tile, plus wrapped neighbours so dots that
  // straddle an edge are drawn on both sides.
  const pts = [];
  for (let m = -n; m <= n; m++) {
    for (let k = -n; k <= n; k++) {
      const x = m * v1[0] + k * v2[0], y = m * v1[1] + k * v2[1];
      const wx = ((x % S) + S) % S, wy = ((y % S) + S) % S;
      if (!pts.some(p => Math.abs(p[0] - wx) < 0.01 && Math.abs(p[1] - wy) < 0.01)) pts.push([wx, wy]);
    }
  }
  const wrapped = [];
  for (const [x, y] of pts) for (const dx of [-S, 0, S]) for (const dy of [-S, 0, S]) wrapped.push([x + dx, y + dy]);

  // Threshold tile: a pixel takes ink when coverage exceeds π·d²/P², which is
  // the coverage at which a dot of radius d would reach that pixel.
  const th = new Float32Array(S * S);
  for (let y = 0; y < S; y++) {
    for (let x = 0; x < S; x++) {
      let d2 = Infinity;
      for (const [px, py] of wrapped) {
        const dx = x + 0.5 - px, dy = y + 0.5 - py, q = dx * dx + dy * dy;
        if (q < d2) d2 = q;
      }
      th[y * S + x] = clamp(Math.PI * d2 / (P * P), 0, 1);
    }
  }
  return { S, P, pts, wrapped, th, patterns: new Map() };
}

function screenOf(name) {
  return screens[name] || (screens[name] = buildScreen(name));
}

/** Screen a greyscale coverage canvas into hard dots. Bake-time only. */
function screenCoverage(covCanvas, name) {
  const sc = screenOf(name);
  const w = covCanvas.width, h = covCanvas.height;
  const src = covCanvas.getContext('2d').getImageData(0, 0, w, h);
  const s = src.data;
  for (let y = 0; y < h; y++) {
    const row = (y % sc.S) * sc.S;
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      const cover = s[i + 3] / 255;
      s[i + 3] = cover > sc.th[row + (x % sc.S)] ? 255 : 0;
    }
  }
  const out = cv(w, h);
  out.getContext('2d').putImageData(src, 0, 0);
  return out;
}

/* ── paper ────────────────────────────────────────────────────────────────────
   Cloudy mottling rather than fine grain: the reference shows blotches a few
   hundred px across at low contrast. Baked once, never recomputed, because any
   per-frame regeneration flickers.                                           */

let paper = null;

function bakePaper() {
  const c = cv(OUTW, OUTH), x = c.getContext('2d');
  x.setTransform(K, 0, 0, K, 0, 0);
  x.fillStyle = PAPER; x.fillRect(0, 0, W, H);

  const r = rngFor('paper');

  // Mottling is a warm wash with noisy alpha, not a neutral multiply: greyscale
  // noise multiplied over cream desaturates it and reads as smoke rather than
  // paper. Keep it subtle at full size and only obvious when zoomed.
  for (const [res, maxA] of [[30, 0.10], [72, 0.075], [165, 0.05]]) {
    const n = cv(res, res), nx = n.getContext('2d');
    const img = nx.createImageData(res, res);
    for (let i = 0; i < res * res; i++) {
      img.data[i * 4] = 0xB4; img.data[i * 4 + 1] = 0xA6; img.data[i * 4 + 2] = 0x8C;
      img.data[i * 4 + 3] = Math.pow(r(), 1.8) * 255 * maxA;
    }
    nx.putImageData(img, 0, 0);
    x.save();
    x.imageSmoothingEnabled = true;
    x.imageSmoothingQuality = 'high';
    x.drawImage(n, 0, 0, W, H);
    x.restore();
  }

  x.save();                                  // fibres
  x.strokeStyle = '#8a7f6a';
  for (let i = 0; i < Math.round(420 * H / W); i++) {
    const px = r() * W, py = r() * H, len = 5 + r() * 22, ang = r() * Math.PI;
    x.globalAlpha = 0.008 + r() * 0.016;
    x.lineWidth = 0.5 + r() * 0.7;
    x.beginPath();
    x.moveTo(px, py);
    x.quadraticCurveTo(px + Math.cos(ang) * len * 0.5 + (r() - 0.5) * 5,
                       py + Math.sin(ang) * len * 0.5 + (r() - 0.5) * 5,
                       px + Math.cos(ang) * len, py + Math.sin(ang) * len);
    x.stroke();
  }
  x.restore();

  x.save();                                  // flecks
  for (let i = 0; i < Math.round(2200 * H / W); i++) {
    x.globalAlpha = 0.012 + r() * 0.03;
    x.fillStyle = r() < 0.55 ? '#7d7362' : '#ffffff';
    x.beginPath();
    x.arc(r() * W, r() * H, 0.4 + r() * 1.0, 0, Math.PI * 2);
    x.fill();
  }
  x.restore();
  return c;
}

/* ── scene drawing helpers ────────────────────────────────────────────────────
   Scenes draw coverage in 1080-space and alpha is tone, so 0.4 means a 40%
   dot screen. Shape helpers carry hand wobble; nothing here is a true circle
   or a straight line.                                                        */

function makeWob(rng, harmonics = 3) {
  const h = [];
  for (let i = 0; i < harmonics; i++) h.push([2 + i, rng() * 2 - 1, rng() * Math.PI * 2]);
  return (th) => h.reduce((s, [k, a, p]) => s + a * Math.sin(k * th + p), 0) / harmonics;
}

const tone = (g, a) => { g.globalAlpha = clamp(a, 0, 1); };


/* ── scene registry ───────────────────────────────────────────────────────── */

const SCENES = {};
const scene = (id, def) => { SCENES[id] = Object.assign({ id, live: null }, def); };

const baked = new Map();

/**
 * Bake a scene to one opaque bitmap: every plate screened, tinted, offset and
 * multiplied onto white, ready to multiply over paper.
 *
 * Baked at its display size, never scaled afterwards. Resampling a halftoned
 * bitmap beats the dot grid against the pixel grid and moirés; real print
 * screens at final size too.
 */
function bakeScene(id, size) {
  const key = id + '@' + size;
  if (baked.has(key)) return baked.get(key);
  const sc = SCENES[id];
  const k = size / W;
  const out = cv(size, size), o = out.getContext('2d');
  o.fillStyle = '#fff';
  o.fillRect(0, 0, size, size);

  const cover = cv(size, size), g = cover.getContext('2d');
  for (const ink of sc.inks) {
    const plate = ink;
    g.setTransform(k, 0, 0, k, 0, 0);
    g.clearRect(0, 0, W, W);
    g.globalAlpha = 1;
    g.globalCompositeOperation = 'source-over';
    g.fillStyle = g.strokeStyle = '#000';
    g.lineCap = 'round';
    g.lineJoin = 'round';
    g.save();
    sc.plates(g, ink, rngFor(id + ':' + ink), rngFor(id + ':shape'));
    g.restore();
    starve(g, rngFor(id + ':' + ink + ':void'));

    const dots = screenCoverage(cover, plate);
    const tin = cv(size, size), tx = tin.getContext('2d');
    tx.drawImage(dots, 0, 0);
    tx.globalCompositeOperation = 'source-in';
    tx.fillStyle = INK[plate];
    tx.fillRect(0, 0, size, size);

    const [rx, ry] = regOf(plate);
    o.save();
    o.globalCompositeOperation = 'multiply';
    o.drawImage(tin, rx, ry);
    o.restore();
  }
  baked.set(key, out);
  return out;
}

/** Ink starvation: evenly filled solids read as laser print, so drop flecks. */
function starve(g, rng) {
  g.save();
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalCompositeOperation = 'destination-out';
  const w = g.canvas.width, n = Math.round(w * 1.1);
  for (let i = 0; i < n; i++) {
    g.globalAlpha = 0.2 + rng() * 0.55;
    g.beginPath();
    g.arc(rng() * w, rng() * w, (0.5 + rng() * 2.0) * K, 0, Math.PI * 2);
    g.fill();
  }
  g.restore();
}

/* ── craft kit ────────────────────────────────────────────────────────────────
   Drawing vocabulary for scene plates. Copy this whole block into a new film,
   between starve() and the scenes.

   Shapes are Path2D values rather than marks on the context, so one shape can
   be filled on one plate, knocked out of another and hatched on a third. That
   is what plate discipline needs, and it removes the usual trap of rebuilding
   a shape per ink and having the knockout miss.

   Everything draws coverage in 1080-space: fill style is already '#000' and
   globalAlpha is tone, so 0.4 means a 40% dot screen.                        */

const TAU = Math.PI * 2;

/* — shape builders ——————————————————————————————————————————————— */

/** Catmull-Rom through pts, as a dense polyline. */
function curve(pts, closed, per) {
  per = per || 12;
  const n = pts.length, out = [];
  const at = (i) => pts[closed ? (i + n * 2) % n : clamp(i, 0, n - 1)];
  const last = closed ? n : n - 1;
  for (let i = 0; i < last; i++) {
    const p0 = at(i - 1), p1 = at(i), p2 = at(i + 1), p3 = at(i + 2);
    for (let k = 0; k < per; k++) {
      const u = k / per, u2 = u * u, u3 = u2 * u;
      out.push([
        0.5 * (2 * p1[0] + (p2[0] - p0[0]) * u + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * u2
               + (3 * p1[0] - p0[0] - 3 * p2[0] + p3[0]) * u3),
        0.5 * (2 * p1[1] + (p2[1] - p0[1]) * u + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * u2
               + (3 * p1[1] - p0[1] - 3 * p2[1] + p3[1]) * u3),
      ]);
    }
  }
  if (!closed) out.push(pts[n - 1].slice());
  return out;
}

/** Points around an ellipse, for feeding cut(). */
function ringPts(x, y, rx, ry, n, rot) {
  const out = [], c = Math.cos(rot || 0), s = Math.sin(rot || 0);
  for (let i = 0; i < n; i++) {
    const th = i / n * TAU, px = Math.cos(th) * rx, py = Math.sin(th) * ry;
    out.push([x + px * c - py * s, y + px * s + py * c]);
  }
  return out;
}

/**
 * Closed hand-cut contour through control points: the silhouette builder.
 * A shape made of arcs and ellipses reads as clip art however good the screen
 * is, because every edge has the same machine curvature.
 *   o.amp   edge waver in px — 2 is a drawn line, 8 is torn stock
 *   o.tear  0..1 chance per sample of a deeper bite inward
 */
function cut(pts, rng, o) {
  o = o || {};
  const amp = o.amp === undefined ? 3 : o.amp, tear = o.tear || 0;
  const c = curve(pts, true, o.per || 10), n = c.length;
  let area = 0;
  for (let i = 0; i < n; i++) {
    const a = c[i], b = c[(i + 1) % n];
    area += a[0] * b[1] - b[0] * a[1];
  }
  const sgn = area > 0 ? 1 : -1;            // keep the normal pointing outward

  /* Displace along the normal, then smooth: an unsmoothed tear lands on one
     sample and reads as damage rather than as a bay in the edge. */
  const w1 = makeWob(rng, 4), w2 = makeWob(rng, 9), d = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const th = i / n * TAU;
    d[i] = (w1(th) + w2(th * 3) * 0.3) * amp;
    if (tear && rng() < tear) d[i] -= amp * (1.4 + rng() * 1.6);
  }
  for (let pass = 0; pass < 2; pass++) {
    const s = Float32Array.from(d);
    for (let i = 0; i < n; i++) d[i] = (s[(i - 1 + n) % n] + s[i] * 2 + s[(i + 1) % n]) * 0.25;
  }

  const p = new Path2D();
  for (let i = 0; i < n; i++) {
    const a = c[(i - 1 + n) % n], b = c[(i + 1) % n];
    let tx = b[0] - a[0], ty = b[1] - a[1];
    const m = Math.hypot(tx, ty) || 1; tx /= m; ty /= m;
    const x = c[i][0] + sgn * ty * d[i], y = c[i][1] - sgn * tx * d[i];
    i ? p.lineTo(x, y) : p.moveTo(x, y);
  }
  p.closePath();
  return p;
}

/**
 * Variable-width ribbon along a path, as a fillable shape. Canvas has no
 * pressure, so a constant lineWidth is the default and it is what makes stems,
 * branches, whiskers and rigging read as wire. wfn(u) returns half-width.
 */
function nib(pts, wfn, o) {
  o = o || {};
  const c = o.raw ? pts : curve(pts, false, o.per || 10);
  const n = c.length, L = [], R = [];
  for (let i = 0; i < n; i++) {
    const a = c[Math.max(0, i - 1)], b = c[Math.min(n - 1, i + 1)];
    let tx = b[0] - a[0], ty = b[1] - a[1];
    const m = Math.hypot(tx, ty) || 1; tx /= m; ty /= m;
    const w = Math.max(0.01, wfn(i / (n - 1)));
    L.push([c[i][0] - ty * w, c[i][1] + tx * w]);
    R.push([c[i][0] + ty * w, c[i][1] - tx * w]);
  }
  const p = new Path2D();
  p.moveTo(L[0][0], L[0][1]);
  for (let i = 1; i < n; i++) p.lineTo(L[i][0], L[i][1]);
  for (let i = n - 1; i >= 0; i--) p.lineTo(R[i][0], R[i][1]);
  p.closePath();
  return p;
}

/** Width profiles for nib(). */
const wTip = (w) => (u) => w * (1 - u * u);                       // full, lifting to a point
const wSwell = (w, at, k) => (u) => w * Math.exp(-Math.pow((u - at) / (k || 0.35), 2));
const wLeaf = (w, skew) => (u) => w * Math.pow(Math.sin(Math.PI * Math.pow(u, skew || 0.55)), 1.15);

/**
 * Calligraphic width from a held nib: widest where the path runs across the
 * nib's axis, thinnest where it runs along it. This is where hand-drawn line
 * weight comes from, and it is what makes a contour read as drawn rather than
 * traced. Pass the same polyline you give nib(), with raw: true.
 */
function wNib(c, w0, ang, floor) {
  const n = c.length, f = floor === undefined ? 0.22 : floor;
  return (u) => {
    const i = clamp(Math.round(u * (n - 1)), 0, n - 1);
    const a = c[Math.max(0, i - 1)], b = c[Math.min(n - 1, i + 1)];
    const th = Math.atan2(b[1] - a[1], b[0] - a[0]);
    return w0 * (f + (1 - f) * Math.abs(Math.sin(th - ang)));
  };
}

/**
 * A horizon band closed to the bottom of the frame: hills, treeline, roofline,
 * wave. Stack several at falling tone and the air between them reads as depth.
 *   o.amp  height of the undulation   o.freq  how many bumps across the frame
 *   o.tilt fraction of W the far end drops   o.teeth adds a jagged octave
 */
function ridgeAt(y, o) {
  const amp = o.amp === undefined ? 60 : o.amp;
  const w = makeWob(o.rng, o.harm || 5), t = o.teeth ? makeWob(o.rng, 7) : null;
  return (u) => y + w(u * (o.freq || 5)) * amp + (o.tilt || 0) * (u - 0.5) * W
                + (t ? t(u * 37) * amp * 0.22 : 0);
}

/**
 * Mountain profile: overlapping triangular peaks with a jagged octave on top,
 * because a skyline built from smooth harmonics always reads as hills however
 * tall it is. Same u -> y contract as ridgeAt, so ridge() takes either.
 */
function peaksAt(y, o) {
  const amp = o.amp === undefined ? 90 : o.amp, n = o.n || 5, ps = [];
  for (let i = 0; i < n; i++) {
    ps.push({ c: (i + 0.5) / n + (o.rng() - 0.5) * 0.7 / n,
              h: amp * (0.4 + o.rng() * 0.6), w: (0.55 + o.rng() * 0.9) / n,
              lean: (o.rng() - 0.5) * 0.7 });
  }
  const jag = makeWob(o.rng, 8);
  return (u) => {
    let top = y;
    for (const p of ps) {
      const d = (u - p.c) / p.w;
      const yy = y - p.h * Math.max(0, 1 - Math.abs(d)) * (1 + p.lean * (d > 0 ? 1 : -1));
      if (yy < top) top = yy;
    }
    return top + jag(u * 26) * amp * 0.06;
  };
}

/** x across the frame -> the u that ridgeAt takes, for planting on a skyline. */
const ridgeU = (x) => (x + 60) / (W + 120);

function ridge(y, o) {
  o = o || {};
  const f = typeof y === 'function' ? y : ridgeAt(y, o);
  const n = o.n || 120, p = new Path2D();
  p.moveTo(-60, W + 60);
  for (let i = 0; i <= n; i++) p.lineTo(-60 + i / n * (W + 120), f(i / n));
  p.lineTo(W + 60, W + 60);
  p.closePath();
  return p;
}

/* — paint operations ————————————————————————————————————————————— */

/** Fill a shape at a tone. */
function print(g, path, a) { tone(g, a === undefined ? 1 : a); g.fill(path); }

/** Knock a shape out of the plate underneath it, at full coverage.
    A knockout drawn at a tone leaves the screen's gaps behind, so the plate
    below shows through the holes — always clear solid. */
function carve(g, path) {
  g.save();
  g.globalAlpha = 1;
  g.globalCompositeOperation = 'destination-out';
  g.fill(path);
  g.restore();
}

/**
 * Print a shape at an exact tone, clearing whatever the plate already holds
 * beneath it. Tones on one plate add where they overlap, so a stack of ridges
 * drawn back to front ends up solid at the bottom of the frame — which looks
 * like a colour band rather than land. Every plane in a depth stack goes
 * through here.
 */
function plane(g, path, a) { carve(g, path); print(g, path, a); }

/** Outline a shape. Line work fades on width and alpha, never on coverage. */
function keyline(g, path, w, a) {
  tone(g, a === undefined ? 1 : a);

  const dm = p.id === 'introA' ? 0 : p.id === 'introB' ? 0.08 * p.u : p.id === 'groove1' ? 0.08 + 0.37 * p.u

  lamp *= 0.85 + 0.25 * kick;
  const jel = jellyAt(t);
  const rise = p.id === 'breakdown' ? phase(t, T(68), 4 * BAR) ** 0.8 : 0;   // riser tension: tracking band
  const st = { t, p, S, k, kick, bass, hat, dm, sub, lamp, rise, jel, jx: jel ? jel.x : 0, jy: jel ? jel.y : 0,

  const f = subAt(T(97)), zu = phase(t, T(97), 2 * BAR), ez = easeInOutCubic(zu);
  st.cam = t < T(97) || st.inside ? { z: 1, fx: 0, fy: 0, ox: 0, oy: 0 } : { z: 1 + 11 * zu ** 3, fx: f.x, fy: f.y, ox: lerp(f.x, 540, ez), oy: lerp(f.y, HC, ez) };

  st.manta = mantaAt(t); st.angler = anglerAt(t); st.siph = siphAt(t); st.combs = combsAt(t);
  st.fish = st.inside ? [] : FISHES.map(f => fishAt(f, st)).filter(Boolean);
  Object.assign(st, creatureLights(st));

}

/* ── shapes (all drawn in black; the plate decides ink and tone) ─────────────── */
function belowSurface(g, st) {                          // clip to the sea
  g.beginPath(); g.moveTo(-10, H + 10);
  for (let x = -10; x <= W + 20; x += 20) g.lineTo(x, st.surf + 6 * Math.sin(x * 0.02 + st.t * 1.6));
  g.lineTo(W + 20, H + 10); g.closePath(); g.clip();
}

  for (let k = 0; k <= 8; k++) gr.addColorStop(k / 8, `rgba(0,0,0,${waterCov(name, k / 8, st.dm).toFixed(3)})`);
  g.save(); belowSurface(g, st); g.fillStyle = gr; g.fillRect(-60, -60, W + 120, H + 120); g.restore();
}

  const gr = g.createLinearGradient(0, 0, 0, st.surf); gr.addColorStop(0, 'rgba(0,0,0,1)'); gr.addColorStop(0.7, 'rgba(0,0,0,0.75)'); gr.addColorStop(1, 'rgba(0,0,0,0.35)');
  g.fillStyle = gr; g.fillRect(-60, -60, W + 120, st.surf + 68);
}

}
// Sunlight rays hang from the surface in world space: they scroll away with the descent and fade
// with depth along their own ramp, never ride the sub. Soft and core as two lifts.
const SHAFT_LEN = 2800;

  gr.addColorStop(0, `rgba(0,0,0,${a})`); gr.addColorStop(0.4, `rgba(0,0,0,${a * 0.45})`); gr.addColorStop(1, 'rgba(0,0,0,0)');

    g.moveTo(x0 - w0 / 2, top); g.lineTo(x0 + w0 / 2, top); g.lineTo(x0 - 760 + wb / 2, bot); g.lineTo(x0 - 760 - wb / 2, bot); g.closePath();
  }

}
function wall(g, st) {
  const y0 = Math.max(SURF0 + 40, st.S - 60), y1 = Math.min(WALL_END, st.S + H + 60);
  if (y1 <= y0) return;
  g.beginPath(); g.moveTo(-10, y0 - st.S);
  for (let wy = y0; wy <= y1; wy += 12) g.lineTo(wallX(wy) * (wy > WALL_END - 300 ? (WALL_END - wy) / 300 : 1), wy - st.S);
  g.lineTo(-10, y1 - st.S); g.closePath(); g.fill();
}

  g.lineCap = 'round';

    if (wy < SURF0 + 60 || wy > WALL_END - 60) continue;
    const r = rngFor('ledge' + wy), fall = wy > WALL_END - 300 ? (WALL_END - wy) / 300 : 1, x1 = wallX(wy) * fall - 14;
    g.lineWidth = 3 + r() * 5; g.beginPath(); g.moveTo(x1 * (0.15 + r() * 0.3), wy - st.S); g.quadraticCurveTo(x1 * 0.7, wy - st.S - 10 - r() * 14, x1, wy - st.S + 6); g.stroke();

}
function coralEach(st, ink, fn) {                        // run fn(g-local, coral) inside each visible coral's frame
  return g => {
    for (const c of CORALS) {

      const y = c.wy - st.S; if (y < -220 || y > H + 140) continue;
      const sway = 0.07 * Math.sin(st.t * 1.2 + c.ph) + 0.12 * st.bass * Math.sin(st.t * 2.3 + c.ph);

  for (const a of c.arcs) {

// The sub: slim and small, a dark hull with an aqua rim light, a dome window and a lamp in the nose.
// Drawn in screen space at st.subS, so it keeps its size while the camera flies in.
const SUBK = 1.25;

  g.beginPath(); g.roundRect(-16, -30, 28, 15, 4); g.fill();                          // sail
  g.beginPath(); g.moveTo(-44, -6); g.lineTo(-66, -22); g.lineTo(-60, -3); g.closePath(); g.fill();   // stern planes
  g.beginPath(); g.moveTo(-44, 6); g.lineTo(-66, 22); g.lineTo(-60, 3); g.closePath(); g.fill();
  const pr = st.t * 14; g.beginPath(); g.ellipse(-68, 0, 3, 12 * Math.abs(Math.cos(pr)) + 3, 0, 0, TAU); g.fill();

}

  g.beginPath(); g.ellipse(0, 0, 55, 14, 0, Math.PI * 1.08, Math.PI * 1.85); g.stroke();
  g.beginPath(); g.moveTo(-12, -28); g.lineTo(9, -28); g.stroke();
  g.restore();
}
function subStripe(g, st) { g.save(); subFrame(g, st); g.beginPath(); g.roundRect(-40, 3, 70, 4, 2); g.fill(); g.restore(); }
function subWindow(g, st) { g.save(); subFrame(g, st); g.beginPath(); g.ellipse(40, -3, 10, 8, 0, 0, TAU); g.fill(); g.restore(); }
function subLampDot(g, st) { g.save(); subFrame(g, st); g.beginPath(); g.arc(57, 1, 5, 0, TAU); g.fill(); g.restore(); }
function nose(st) { const { x, y, a } = st.subS; return [x + Math.cos(a) * 56 * SUBK, y + Math.sin(a) * 56 * SUBK, a]; }

function beam(g, st, a0, spread, reach) {

function bubbles(g, st, outline) {                      // stream from the sail, rising in world space

// Sonar: one slow ping per bar on the 2.5 (the eighth after beat 2), bars 1–60, as a packet of four

// Jelly: a fast pressure wave on every kick of the drop, scaled with the jelly.

function sun(g, st) {
  if (st.surf < -10) return;

  g.save(); g.beginPath(); g.rect(0, 0, W, st.surf); g.clip();

/* ── plates ──────────────────────────────────────────────────────────────────── */
// Water tone per plate at four depths (shallow, mid, deep, abyss), each [top, bottom] of frame.
// Shallow is a near-white cyan over a saturated blue floor; deep is blue + indigo + purple, violet
// rather than grey; the abyss closes it further, still an overprint, never black.
SCREEN.blue = { a: 3, b: 1 };                            // on aqua's angle: two waters on different angles beat into a diamond moiré
// Four inks, as in reference/films/roost: blue and indigo carry the sea, pink turns the deep violet
// and the dusk purple, sunflower is the light; orange is pink over sunflower.
const WATER = {
  blue:   [[0.2,  0.62], [0.5,  0.78], [0.6,  0.5],  [0.48, 0.4]],
  indigo: [[0.0,  0.08], [0.08, 0.3],  [0.62, 0.8],  [0.8,  0.9]],

const SEA_PLATES = Object.keys(WATER);

const SUBDARK = { blue: 0.7, indigo: 0.95, pink: 0.3 };
function waterCov(name, y, dm) {
  const w = WATER[name], at = d => lerp(w[d][0], w[d][1], y);
  return dm < 0.5 ? lerp(at(0), at(1), dm * 2) : dm < 1 ? lerp(at(1), at(2), dm * 2 - 1) : lerp(at(2), at(3), clamp(dm - 1, 0, 1));
}
function backgroundPlate(name, st) {
  const wc = y => waterCov(name, clamp(y / H, 0, 1), st.dm), dm1 = Math.min(1, st.dm), bands = [];
  bands.push({ coverage: 1, draw: g => water(g, st, name) });
  bands.push({ coverage: SKY[name], draw: g => sky(g, st) });
  bands.push({ lift: 1, draw: g => surfaceGlow(g, st) });
  bands.push({ lift: 1, draw: g => shafts(g, st, false) });
  bands.push({ lift: 1, draw: g => shafts(g, st, true) });
  bands.push({ coverage: ROCK[name] * (0.85 + 0.15 * dm1), draw: g => wall(g, st) });
  bands.push({ coverage: Math.min(1, ROCK[name] * (0.85 + 0.15 * dm1) + 0.12), draw: g => wallLedges(g, st) });
  for (const f of st.fish) bands.push({ over: (f.L > 55 ? 0.62 : 0.36) * (1 - 0.5 * dm1) * (name === 'pink' ? 0 : 1), draw: g => { g.beginPath(); fishSil(g, f.x, f.y, f.L, f.dir, f.wag, f.i); g.fill(); } });
  if (st.manta) bands.push({ over: name === 'pink' ? 0 : 0.6, draw: g => mantaShape(g, st.manta) });
  if (st.angler) {                                        // a shade darker than the water, the mouth darker still
    bands.push({ over: 0.4, draw: g => anglerBody(g, st.angler) });
    bands.push({ over: 0.7, draw: g => anglerMouth(g, st.angler) });
    bands.push({ coverage: 0, draw: g => anglerTeeth(g, st.angler) });
  }
  if (st.lamp > 0.02) {                                   // the beam lifts the water: a wide soft cone and a hot core
    bands.push({ lift: 0.5 * st.lamp, draw: g => beam(g, st, 1, 1.5, 1050) });
    bands.push({ lift: 0.85 * st.lamp, draw: g => beam(g, st, 1, 0.7, 760) });
  }
  if (st.ghosts.length) bands.push({ lift: 0.3, draw: g => ghostPath(g, st.ghosts) });   // translucent bodies
  if (st.lights.length) {                                 // the creatures' lights: soft glow, then paper
    bands.push({ lift: 1, draw: g => st.lights.forEach(d => { glowFill(g, d.x, d.y, d.r * 5, 0.7); g.beginPath(); g.arc(d.x, d.y, d.r * 5, 0, TAU); g.fill(); }) });
    bands.push({ coverage: 0, draw: g => dotsPath(g, st.lights, null, 1) });
  }
  if (st.jel) {                                           // the jelly's glow opening the water, then its body
    bands.push({ lift: 1, draw: g => jellies(g, st, (g, s) => { glowFill(g, s.jx, s.jy - 80, 820, 0.7, 0.4); g.beginPath(); g.arc(s.jx, s.jy - 80, 820, 0, TAU); g.fill(); }) });
    bands.push({ coverage: 0, draw: g => jellies(g, st, jellySil) });
    bands.push({ coverage: name === 'indigo' ? 0.2 : name === 'blue' ? 0.12 : 0, draw: g => jellies(g, st, jellyBell) });
  }
  const sc = st.school;
  if (sc) {                                               // the school's glow: lifted halos, then the fish on paper
    bands.push({ lift: 0.22 * sc.glow, draw: g => schoolPath(g, sc, -1, 3) });
    bands.push({ lift: 0.45 * sc.glow, draw: g => schoolPath(g, sc, -1, 1.8) });
    bands.push({ coverage: 0, draw: g => schoolPath(g, sc, -1, 1) });
  }
  bands.push({ coverage: SUBDARK[name], draw: g => subBody(g, st) });
  bands.push({ coverage: 0, draw: g => brights(g, st) });
  fastBandPass(ctx, name, {}, bands);
}

function interiorPlates(st) {
  const sc = st.school, knock = g => { schoolPath(g, sc, -1, 1); gonadsIn(g, st); subRim(g, st); subWindow(g, st); subLampDot(g, st); subStripe(g, st); };
  const all = g => g.fillRect(-60, -60, W + 120, H + 120);
  const lamp = [{ lift: 0.45 * st.lamp, draw: g => beam(g, st, 1, 1.5, 950) }, { lift: 0.8 * st.lamp, draw: g => beam(g, st, 1, 0.7, 700) }];
  const hull = c => ({ coverage: c, draw: g => subBody(g, st) });
  fastBandPass(ctx, 'pink', {}, [{ coverage: 0.58, draw: all }, ...lamp, { lift: 0.4, draw: g => schoolPath(g, sc, -1, 2.2) }, hull(0.4), { coverage: 0, draw: knock }]);
  fastBandPass(ctx, 'indigo', {}, [{ coverage: 0.14, draw: all }, { coverage: 0.3, draw: g => rimShade(g, st, 330) }, { coverage: 0.48, draw: g => rimShade(g, st, 470) }, { coverage: 0.68, draw: g => rimShade(g, st, 620) },
    ...lamp, { lift: 0.3, draw: g => schoolPath(g, sc, -1, 2.2) }, hull(0.95), { coverage: 0, draw: knock }]);
  fastBandPass(ctx, 'sunflower', {}, [{ coverage: 0.75, draw: g => canals(g, st) }, { coverage: 0, draw: g => { knock(g); subBody(g, st); } }]);
  inkPass(ctx, 'sunflower', {}, g => gonadsIn(g, st));
}

function drawArt(t) {
  const st = stateAt(t);
  CAM = st.cam;
  if (st.inside) interiorPlates(st);
  else drawSea(st);

  // The school: fluo dots on their paper, each ink inside a faint halo of itself.
  if (st.school) SCH_INKS.forEach((ink, k) => {
    const sc = st.school;
    fastBandPass(ctx, ink, {}, [{ coverage: 0.16 * sc.glow * SCH_COV[ink], draw: g => schoolPath(g, sc, k, 1.8) }, { coverage: 0, draw: g => schoolPath(g, sc, -1, 1) }]);
    inkPass(ctx, ink, { coverage: SCH_COV[ink] }, g => schoolPath(g, sc, k, 1));
  });

  // Sub: aqua rim light and window, florange stripe, the lamp in the nose with its beam.
  inkPass(ctx, 'blue', { coverage: 0.4 }, g => subWindow(g, st));
  inkPass(ctx, 'sunflower', {}, g => subStripe(g, st));
  if (st.lamp > 0.02) {
    fastBandPass(ctx, 'sunflower', {}, [{ coverage: 0.9 * st.lamp, draw: g => beam(g, st, 1, 0.55, 520) }, { coverage: 1, draw: g => subLampDot(g, st) },
      { coverage: 0, draw: g => { subBody(g, st); if (st.school) schoolPath(g, st.school, -1, 1); } }, { coverage: 1, draw: g => subLampDot(g, st) }]);
    fastBandPass(ctx, 'pink', {}, [{ coverage: 0.5 * st.lamp, draw: g => { const [x, y] = nose(st); g.setTransform(K, 0, 0, K, 0, 0); glowFill(g, x, y, 90, 1, 0.3); g.beginPath(); g.arc(x, y, 90, 0, TAU); g.fill(); } },
      { coverage: 0, draw: g => subBody(g, st) }]);
  }

  // Sonar, confetti and bubbles over paper.
  if (!st.inside) {
    inkPass(ctx, 'blue', { alpha: 0.2 }, g => { g.strokeStyle = '#000'; rings(g, st, false); });
    if (st.drop) inkPass(ctx, 'pink', {}, g => { g.strokeStyle = '#000'; rings(g, st, true); });
    inkPass(ctx, 'blue', { alpha: 0.5 }, g => { g.strokeStyle = '#000'; g.lineWidth = 1.6; bubbles(g, st, true); });
  }
  CAM = { z: 1, fx: 0, fy: 0, ox: 0, oy: 0 };
  // Drop flash.
  const dropAge = t + LEAD - T(73), flash = dropAge >= 0 && dropAge < 1.2 ? Math.exp(-dropAge * 3.5) : 0;
  if (flash > 0.02) inkPass(ctx, 'pink', { coverage: 0.25 + 0.5 * flash, alpha: flash }, g => g.fillRect(0, 0, W, H));

  // Tape: dropout lines always, tracking band on the riser and transition, glitch tears only in the drop.
  const k = st.k, inDrop = st.p.id === 'drop' || st.p.id === 'outro';
  // Tears escalate in 8-bar steps: every 4th bar, then every bar, then every bar harder; the outro calms back.
  const every = k && (k.bar >= 81 && k.bar <= 96 ? 1 : 4), hard = k && k.bar >= 89 && k.bar <= 96;
  const tear = inDrop && k && k.down && k.age < 0.13 && (k.bar - 1) % every === 0 ? (k.bar % 8 === 1 ? 0.8 : hard ? 0.5 : 0.3) : 0;
  // The print is the picture (as in roost); the tape is a light touch, and only the drop tears it.
  vhs(ctx, t, {
    chroma: 0.6 + (inDrop ? 3 : 0) * st.kick + 10 * flash,
    track: clamp((st.p.id === 'trans' ? 0.35 : 0) + st.rise * 0.6, 0, 1),
    glitch: Math.max(tear, flash),
    glitchKey: k ? k.i : 0,
    noise: 0.02, scan: 0.03, bleed: 0.12, wobble: 0.3,
    lines: inDrop ? Math.round(3 * YS) : 0,
  });
}

function drawSea(st) {
  for (const name of SEA_PLATES) backgroundPlate(name, st);

  // Horizon haze over the sea at sunset, sun and glints.
  if (st.surf > -30) inkPass(ctx, 'pink', { coverage: 0.4 }, g => { g.fillRect(0, st.surf - 140, W, 140); g.globalCompositeOperation = 'destination-out'; sun(g, st); });
  if (st.surf > -120) inkPass(ctx, 'sunflower', {}, g => { sun(g, st); g.globalCompositeOperation = 'destination-out'; g.fillRect(0, st.surf - 60, W, H); g.globalCompositeOperation = 'source-over'; glints(g, st); });
  if (st.surf > -20) inkPass(ctx, 'pink', { coverage: 0.7 }, g => { sun(g, st); g.globalCompositeOperation = 'destination-out'; g.fillRect(0, 0, W, st.surf - 70); });

  // Reef in four inks, tips glowing sunflower (cut from their coral ink first, so they stay yellow).
  if (st.S < CORAL_END + 300) {
    inkPass(ctx, 'pink', {}, g => { g.strokeStyle = '#000'; coralEach(st, 'pink', coralShape)(g); coralEach(st, 'orange', coralShape)(g); g.globalCompositeOperation = 'destination-out'; coralEach(st, null, coralTips)(g); });
    inkPass(ctx, 'sunflower', {}, g => { g.strokeStyle = '#000'; coralEach(st, 'sunflower', coralShape)(g); coralEach(st, 'orange', coralShape)(g); coralEach(st, null, coralTips)(g); });
  }

  // Creature lights, each ink on its paper inside a bloom of itself.
  for (const ink of ['sunflower', 'blue', 'pink']) if (st.lights.some(d => d.ink === ink)) {
    fastBandPass(ctx, ink, {}, [{ coverage: 1, draw: g => st.lights.filter(d => d.ink === ink).forEach(d => { glowFill(g, d.x, d.y, d.r * 4, 0.35); g.beginPath(); g.arc(d.x, d.y, d.r * 4, 0, TAU); g.fill(); }) }]);
    inkPass(ctx, ink, {}, g => dotsPath(g, st.lights, ink, 1));
  }

  // Jelly: a magenta bloom, the bell deepening to its rim, tentacles and arms in solid pink with
  // florange highlights, and a hot rim light of sunflower over the pink (it prints orange).
  if (st.jel) {
    const J = fn => g => jellies(g, st, fn);
    fastBandPass(ctx, 'pink', {}, [{ coverage: 1, draw: J((g, s) => { glowFill(g, s.jx, s.jy - 80, 760, 0.6, 0.4); g.beginPath(); g.arc(s.jx, s.jy - 80, 760, 0, TAU); g.fill(); }) },
      { coverage: 0.72, draw: J(jellyBell) }, { over: 0.55, draw: J((g, s) => { g.beginPath(); bellPath(g, s, 1); bellPath(g, s, 0.78); g.fill('evenodd'); }) },
      { coverage: 1, draw: J((g, s) => { jellyRim(g, s); tentacles(g, s, false); oralArms(g, s); }) },
      ...(st.school ? [{ coverage: 0, draw: g => schoolPath(g, st.school, -1, 1) }] : [])]);   // fish in front of the jelly stay on paper
    inkPass(ctx, 'sunflower', {}, J((g, s) => { g.strokeStyle = '#000'; jellyRibs(g, s); jellyGonads(g, s, false); tentacles(g, s, true); }));
    inkPass(ctx, 'sunflower', { coverage: 0.35 }, J(oralArms));
    inkPass(ctx, 'sunflower', {}, J((g, s) => { g.strokeStyle = '#000'; jellyEdge(g, s, 22); jellyGonads(g, s, true); }));
    fastBandPass(ctx, 'sunflower', {}, [{ coverage: 1, draw: J((g, s) => { glowFill(g, s.jx, s.jy - 230, 420, 0.4, 0.4); g.beginPath(); g.arc(s.jx, s.jy - 230, 420, 0, TAU); g.fill(); }) }]);
  }
}
const SHOTS = PARTS.map(p => ({ id: p.id, start: T(p.a), end: Math.min(DUR, T(p.b)), readAt: (T(p.a) + Math.min(DUR, T(p.b))) / 2, action: p.id, transition: 'continuous' }));
// ART END

const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
canvas.width=OUTW;canvas.height=OUTH;
paper=bakePaper();
// Paper is kept as pixels in JS memory and put back every frame. The baked canvas alone does not
// survive a GPU reset: in the 2026-09-25 full render three parallel 1080 processes each went dark
// for the rest of their chunk (49–64, 80–96, 115–128 s), inks printing on the page background.
const paperData=paper.getContext('2d').getImageData(0,0,OUTW,OUTH);
const scrub=document.getElementById('scrub'),clockLabel=document.getElementById('time');
function render(t) {
  t=clamp(t,0,DUR); ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  ctx.putImageData(paperData,0,0);if(paper.getContext('2d').isContextLost?.())paper=bakePaper();drawArt(t);scrub.value=t;clockLabel.value=t.toFixed(2);
}
function paintBaked(id) {
  ctx.save();ctx.globalCompositeOperation='multiply';ctx.drawImage(bakeScene(id,OUTW),0,0);ctx.restore();
}
/* A frame slower than the frame interval cannot play live (live-plate films take
   100-200 ms): Play then renders every frame once into a WebP cache, shown as
   "Buffering n%", and plays from it at FPS; replays are immediate. Fast films play
   live. seek() and window.__riso stay live and pure; tools never touch the cache. */
const FPS=30,NF=Math.round(DUR*FPS),cache=[],bitmaps=new Map(),playBtn=document.getElementById('play');
const audio=document.getElementById('track');
let at=0,playing=false,epoch=0,recorder=null,recordURL=null,slow=null,buffering=false,filled=0;
function label(){playBtn.textContent=playing?'Pause':buffering?'Buffering '+Math.round(filled/(NF+1)*100)+'%':'Play';}
function start(){if(at>=DUR)at=0;epoch=performance.now()-at*1000;playing=true;label();if(audio){audio.currentTime=at;audio.play().catch(()=>{});}}
function pause(){if(playing)at=clamp(audio&&!audio.paused?audio.currentTime:(performance.now()-epoch)/1000,0,DUR);if(audio)audio.pause();playing=false;buffering=false;label();if(recorder?.state==='recording')recorder.stop();}
async function buffer(){
  buffering=true;label();const resume=at;
  for(let i=0;i<=NF&&buffering;i++){
    if(cache[i])continue;
    render(i/FPS);canvas.toBlob(b=>{cache[i]=b;filled++;},'image/webp',0.8);   // snapshots now, encodes alongside the next draw
    label();await new Promise(r=>setTimeout(r,0));
  }
  while(buffering&&filled<NF+1)await new Promise(r=>setTimeout(r,50));
  if(buffering){buffering=false;at=resume;start();}
}
function play(){
  if(at>=DUR)at=0;
  if(slow===null){const t0=performance.now();render(at);render(at);slow=(performance.now()-t0)/2>900/FPS;}
  if(!slow||filled>=NF+1)start();else buffer();
}
function seek(t){pause();at=clamp(t,0,DUR);render(at);}
playBtn.onclick=()=>playing||buffering?pause():play();
document.getElementById('replay').onclick=()=>{seek(0);play();};
scrub.oninput=()=>seek(Number(scrub.value));
addEventListener('keydown',e=>{if(e.target.matches('input'))return;if(['Space','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.code==='Space')playing||buffering?pause():play();if(e.code==='ArrowLeft')seek(at-1/FPS);if(e.code==='ArrowRight')seek(at+1/FPS);});
document.getElementById('record').onclick=()=>{
  if(recorder?.state==='recording'){pause();return;}
  const mime=['video/webm;codecs=vp8','video/webm;codecs=vp9','video/webm'].find(m=>MediaRecorder.isTypeSupported(m));
  if(!mime)throw Error('No supported recording codec; use tools/render.mjs');
  seek(0);const stream=canvas.captureStream(FPS),chunks=[];recorder=new MediaRecorder(stream,{mimeType:mime});
  recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
  recorder.onstop=()=>{stream.getTracks().forEach(t=>t.stop());if(recordURL)URL.revokeObjectURL(recordURL);recordURL=URL.createObjectURL(new Blob(chunks,{type:mime}));const a=document.getElementById('download');a.href=recordURL;a.download='preview.webm';a.style.display='inline';};
  recorder.start();play();
};
function tick(now){
  if(playing){
    at=clamp(audio&&!audio.paused?audio.currentTime:(now-epoch)/1000,0,DUR);   // the track is the clock when it plays
    if(!slow)render(at);
    else{
      const i=Math.min(NF,Math.floor(at*FPS));
      for(let j=i;j<Math.min(NF+1,i+8);j++)if(cache[j]&&!bitmaps.has(j)){bitmaps.set(j,null);createImageBitmap(cache[j]).then(b=>bitmaps.set(j,b));}
      for(const [j,b] of bitmaps)if(j<i-1){if(b)b.close();bitmaps.delete(j);}
      const b=bitmaps.get(i);
      if(b){ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.drawImage(b,0,0);scrub.value=at;clockLabel.value=at.toFixed(2);}
    }
    if(at>=DUR)pause();
  }
  requestAnimationFrame(tick);
}
window.__riso={duration:DUR,ready:false,seek,shots:SHOTS,audioFile:'track.wav'};
for(const id of Object.keys(SCENES))bakeScene(id,OUTW);
seek(Number(new URLSearchParams(location.search).get('t'))||0);
requestAnimationFrame(tick);
window.__riso.ready=true;
</script></html>
