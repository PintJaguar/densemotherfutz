<script>

  }
  P.paint(slabs, { indigo: .62, purple: .5, blue: .35 }); P.paint(doorsP, { blue: .55, purple: .5, indigo: .55 });
  P.add(workH, C.gold, 0.45 * pw); P.paint(work, mix(C.sun, PAPERW, 0.5), pw);
  halos.forEach((Hl, i) => P.add(Hl, FLOOR_COLS[i], 0.6 * pw));

}

/* ── shots ─────────────────────────────────────────────────────────────────── */
const SHOT_DRAW = { shaft: shaftView, shaftBuild: shaftView };
function drawArt(t) {

  (SHOT_DRAW[st.id] || cabin)(st);
  // drop flash
  const da = t + LEAD - T(73);
  if (da >= 0 && da < 1.2) { P.light(FULL, 1, Math.exp(-da * 4)); P.add(FULL, { pink: .6, sunflower: .3 }, 0.6 * Math.exp(-da * 6)); }

  const tear = inDrop && k && k.down && k.age < 0.13 && (k.bar - 1) % every === 0 ? (k.bar % 8 === 1 ? 0.8 : hard ? 0.5 : 0.3) : 0;

  vhs(t, {
    chroma: 2.2 + (inDrop ? 4 : 1.4) * st.kick + 12 * flash + (st.id === 'shaftBuild' ? 5 * phase(t, T(69), 4 * BAR) ** 2 : 0),
    track: clamp((st.id === 'shaftBuild' ? 0.3 + 0.6 * phase(t, T(69), 4 * BAR) : 0) + (st.id === 'outage' ? 0.25 : 0), 0, 1),
    glitch: Math.max(tear, flash, st.id === 'fill' ? 0.35 * kickEnv(t, 0.08) : 0),
    glitchKey: k ? k.i : 0,
    noise: 0.05 + (st.id === 'outage' ? 0.05 : 0), scan: 0.1, bleed: 0.22, sat: 1.4, contrast: 1.15, lines: Math.round(6 * H / W),

}
const SHOTS = SHOTLIST.map(s => ({ id: s.id, start: s.t0, end: s.t1, readAt: (s.t0 + s.t1) / 2, action: s.id, transition: 'cut' }));
// ART END

/* ── runtime ─────────────────────────────────────────────────────────────── */
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
canvas.width = OUTW; canvas.height = OUTH;
paperData = bakePaper();
const scrub = document.getElementById('scrub'), clockLabel = document.getElementById('time');
function render(t) {
  t = clamp(t, 0, DUR);
  drawArt(t);
  ctx.putImageData(frameImg, 0, 0);
  scrub.value = t; clockLabel.value = t.toFixed(2);
}
/* A frame slower than the frame interval cannot play live: Play renders every frame once into a WebP

const audio = document.getElementById('track');
let at = 0, playing = false, epoch = 0, recorder = null, recordURL = null, slow = null, buffering = false, filled = 0;
function label() { playBtn.textContent = playing ? 'Pause' : buffering ? 'Buffering ' + Math.round(filled / (NF + 1) * 100) + '%' : 'Play'; }
function start() { if (at >= DUR) at = 0; epoch = performance.now() - at * 1000; playing = true; label(); if (audio) { audio.currentTime = at; audio.play().catch(() => {}); } }

  buffering = true; label(); const resume = at;
  for (let i = 0; i <= NF && buffering; i++) { if (cache[i]) continue; render(i / FPS); canvas.toBlob(b => { cache[i] = b; filled++; }, 'image/webp', 0.8); label(); await new Promise(r => setTimeout(r, 0)); }

}
function play() { if (at >= DUR) at = 0; if (slow === null) { const t0 = performance.now(); render(at); render(at); slow = (performance.now() - t0) / 2 > 900 / FPS; } if (!slow || filled >= NF + 1) start(); else buffer(); }

playBtn.onclick = () => playing || buffering ? pause() : play();
document.getElementById('replay').onclick = () => { seek(0); play(); };
scrub.oninput = () => seek(Number(scrub.value));
addEventListener('keydown', e => { if (e.target.matches('input')) return; if (['Space', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault(); if (e.code === 'Space') playing || buffering ? pause() : play(); if (e.code === 'ArrowLeft') seek(at - 1 / FPS); if (e.code === 'ArrowRight') seek(at + 1 / FPS); });
